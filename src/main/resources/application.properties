spring.application.name=url-shortener
spring.datasource.url=jdbc:h2:file:./data/url-shortener
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
spring.mvc.problemdetails.enabled=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.jwt-secret=${JWT_SECRET:}
app.jwt-ttl=PT2H
app.create-limit=10
app.create-period=PT1M
app.cleanup-delay-ms=3600000
app.expired-retention=P7D
app.cache-ttl=PT1M
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=1000
